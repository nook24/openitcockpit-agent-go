[default]
  # Windows only: Use this file to monitor Windows performance counters. Every section defines one counter.
  # The name of the section is used in openITCOCKPIT to select the counter.
  # Section names are case insensitive and will be converted to lower case.
  #
  # Counter paths have to be in English, independent of the language of Windows.
  # Use "typeperf -qx" or the Performance Monitor (perfmon.exe) to find counters.
  # The wildcard * returns the values of all instances, e.g. \Processor(*)\% Processor Time
  # Thresholds are configured in openITCOCKPIT and can be applied to all or a single instance.
  #
  # Options:
  #   counter = English counter path, e.g. \Processor(_Total)\% Processor Time
  #   enabled = true or false

#[cpu_per_core]
#  counter = \Processor(*)\% Processor Time
#  enabled = true

#[memory_available]
#  counter = \Memory\Available MBytes
#  enabled = true

#[disk_queue]
#  counter = \PhysicalDisk(*)\Current Disk Queue Length
#  enabled = true

#[sql_user_connections]
   # Default instance of Microsoft SQL Server. Named instances use \MSSQL$INSTANCENAME:General Statistics\...
#  counter = \SQLServer:General Statistics\User Connections
#  enabled = true

#[iis_current_connections]
#  counter = \Web Service(_Total)\Current Connections
#  enabled = true
