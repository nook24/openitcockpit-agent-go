[default]
  # Use this file to monitor X.509 certificates. Every section defines one check.
  # The name of the section is used in openITCOCKPIT to select the certificates.
  # Section names are case insensitive and will be converted to lower case.
  #
  # The agent reports expiry date, chain, key and signature algorithm of every certificate.
  # Thresholds (days until expiry, weak cryptography, ...) are configured in openITCOCKPIT.
  #
  # Options:
  #   type         = file (all platforms) or windows_store (Windows). Default: file
  #   path         = file only: Path or glob pattern of PEM or DER encoded certificate files.
  #                  The first certificate of a file is monitored, all other certificates of the file are used as chain.
  #   store        = windows_store only: Certificate store. Default: LocalMachine\My
  #                  Examples: LocalMachine\My, LocalMachine\WebHosting, LocalMachine\Remote Desktop, CurrentUser\My
  #                  Monitoring the Root or CA stores is not recommended, as Windows keeps expired legacy root certificates
  #   subject      = Regular expression to filter certificates by subject or DNS name (optional)
  #   hostname     = Check if the certificate is valid for this hostname (optional)
  #   ca_file      = PEM file with additional trusted root certificates, e.g. of an internal CA (optional)
  #   skip_verify  = true to not verify the chain against the trusted root certificates (e.g. self signed certificates)
  #                  On macOS CA certificates (e.g. of a CA bundle) are never verified, as the macOS verifier
  #                  only accepts server certificates. Expiry and weak cryptography are checked anyway.
  #   split_bundle = file only: true to monitor every certificate of a file on its own (e.g. CA bundles)
  #   include_all  = windows_store only: true to monitor all certificates. By default only the newest
  #                  certificate per subject is monitored, so replaced certificates do not raise an alert
  #   enabled      = true or false
  #
  # Please note: # and ; start a comment, even inside of double quotes.
  # Wrap regular expressions containing # or ; in backticks.

