[default]
  # Use this file to monitor the hardware of servers with the Redfish API of their BMC
  # (e.g. Dell iDRAC, HPE iLO, Lenovo XClarity Controller, Supermicro, Fujitsu iRMC).
  # Every section defines one BMC. The agent can reach BMCs in a management network,
  # which is not reachable by the openITCOCKPIT server.
  # The name of the section is used in openITCOCKPIT to select the BMC.
  # Section names are case insensitive and will be converted to lower case.
  #
  # The agent queries every BMC in the background, by default every 5 minutes, and reports
  # the health of the systems, chassis and BMC, temperatures, fans, power supplies, power consumption,
  # storage controllers, drives, volumes and the warnings and critical entries of the event logs.
  # The agent logs in once and reuses the session, so the BMC does not log a login every few minutes.
  #
  # This file contains passwords, it should only be readable by the agent (chmod 600 on Linux and macOS).
  # Please use a user with read only privileges:
  #   Dell iDRAC: role "Read Only"
  #   HPE iLO: no privileges besides "Login"
  #   Lenovo XClarity Controller: role "ReadOnly"
  #   Supermicro: role "User"
  #
  # Options:
  #   url               = https:// URL of the BMC, e.g. https://10.0.0.10
  #   username          = Username of the BMC
  #   password          = Password of the BMC
  #   skip_verify       = true to not verify the TLS certificate (most BMCs use self signed certificates)
  #   fingerprint       = SHA-256 fingerprint of the certificate of the BMC (recommended instead of skip_verify)
  #                       openssl s_client -connect 10.0.0.10:443 </dev/null 2>/dev/null | openssl x509 -noout -fingerprint -sha256
  #   interval          = Seconds between two queries of the BMC. Default: 300, minimum: 60
  #   timeout           = Timeout of a single request in seconds. Default: 30
  #   eventlog          = true or false. Read the event logs of the BMC. Default: true
  #   eventlog_window   = Report warnings and critical event log entries of the last N seconds. Default: 86400
  #   eventlog_services = Regular expression for the log services which are read.
  #                       Default: (?i)^(sel|iml|log[0-9]*|eventlog|platformlog|activelog)$
  #                       (the Dell Lifecycle log and audit logs are skipped, as they are huge)
  #   proxy             = HTTP proxy, e.g. http://proxy.example.com:3128. By default no proxy is used
  #   allow_http        = true to allow http:// URLs. The password would be sent in plain text!
  #   enabled           = true or false
  #
  # Please note: # and ; start a comment, even inside of double quotes.
  # Wrap values containing # or ; in backticks, e.g. password = `pass#word;1`

#[server01]
#  url = https://10.0.0.10
#  username = monitoring
#  password = secret
#  fingerprint = 66:B4:A7:78:78:1F:7D:3E:9D:EE:B1:99:F3:FA:C0:6D:7B:F3:55:5A:38:68:AC:A1:CA:21:97:94:E0:C4:B6:5E
#  enabled = true

#[server02]
#  url = https://ilo-server02.example.local
#  username = monitoring
#  password = `secret#password`
#  skip_verify = true
#  interval = 600
#  eventlog_window = 3600
#  enabled = true
