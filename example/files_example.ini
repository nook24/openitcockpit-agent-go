[default]
  # Use this file to monitor files and directories. Every section defines one check.
  # The name of the section is used in openITCOCKPIT to select the check.
  # Section names are case insensitive and will be converted to lower case.
  #
  # The agent reports existence, size and modification time.
  # Thresholds (maximum age, minimum size, number of files, ...) are configured in openITCOCKPIT.
  #
  # Options:
  #   type      = file or directory. Default: file
  #   path      = file: Path or glob pattern of the file(s). directory: Path of the directory
  #   pattern   = directory only: Only count files matching this glob pattern, e.g. *.tar.gz (optional)
  #   recursive = directory only: true to include files of sub directories. Default: false
  #   max_files = directory only: Stop after this number of files. Default: 100000
  #   enabled   = true or false

