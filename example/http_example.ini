[default]
  # Use this file to monitor HTTP(S) endpoints. Every section defines one check.
  # The agent can reach internal services, which are not reachable by the openITCOCKPIT server.
  # The name of the section is used in openITCOCKPIT to select the check.
  # Section names are case insensitive and will be converted to lower case.
  #
  # The agent reports status code, response time, body size and if the content matches.
  # Thresholds (response time) are configured in openITCOCKPIT.
  # To monitor the certificate of an HTTPS endpoint use a "tls" definition in the certificates.ini.
  #
  # Options:
  #   url              = http:// or https:// URL
  #   method           = GET, HEAD or POST. Default: GET
  #   timeout          = Timeout of the whole request in seconds. Default: 10
  #   expected_status  = Comma separated list of status codes and ranges. Default: 200-399
  #   match            = Regular expression the response body has to match (first 1 MiB, optional)
  #   follow_redirects = true or false. Default: true
  #   skip_verify      = true to not verify the TLS certificate (e.g. self signed certificates)
  #   username         = Username for HTTP basic authentication (optional)
  #   password         = Password for HTTP basic authentication (optional)
  #   host_header      = Value of the Host header, e.g. to check a virtual host by IP address (optional)
  #   proxy            = HTTP proxy, e.g. http://proxy.example.com:3128. By default no proxy is used
  #   enabled          = true or false
  #
  # Please note: # and ; start a comment, even inside of double quotes.
  # Wrap values containing # or ; in backticks.

