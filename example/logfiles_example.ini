[default]
  # Use this file to monitor log files for lines matching a regular expression.
  # Every section defines one log source. The name of the section is used in openITCOCKPIT to select the log.
  # Section names are case insensitive and will be converted to lower case.
  #
  # The agent counts all matching lines within a sliding time window (window = 300 => last 5 minutes)
  # and reports the latest matching lines. After the agent started, only new lines are evaluated.
  #
  # Options:
  #   type           = file (all platforms), journald (Linux) or unifiedlog (macOS). Default: file
  #   path           = file only: Path or glob pattern of the log file(s), e.g. /var/log/nginx/*error.log
  #   unit           = journald only: Comma separated list of systemd units (optional)
  #   priority       = journald only: Priority or range, e.g. err or 0..3 (optional, see journalctl -p)
  #   predicate      = unifiedlog only: Filter passed to "log show --predicate" (optional)
  #   match          = Regular expression (Go RE2 syntax) a line has to match. If empty, every new line matches
  #   exclude        = Regular expression to ignore lines which would match otherwise (optional)
  #   window         = Size of the sliding window in seconds. Default: 300
  #   max_lines      = Number of the latest matching lines to report. Default: 10
  #   max_read_bytes = Maximum bytes to read per check run and log source. Default: 16777216 (16 MiB)
  #   enabled        = true or false
  #
  # Please note: # and ; start a comment, even inside of double quotes.
  # Wrap regular expressions containing # or ; in backticks, e.g.: match = `error #\d+`

